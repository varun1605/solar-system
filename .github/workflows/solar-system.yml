
name: Solar-System-Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

jobs: 
  unit-testing:
    name: unit-testing
    runs-on: ubuntu-latest

    steps: 
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Install Nodejs
      uses: actions/setup-node@v6
      with: 
        node-version: '18'

    - name: Run test Case
      run: npm test

  
